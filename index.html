<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>담비위키</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.css">
<style>
  :root{--primary:#2563eb;--bg:#f7fafc;--dark:#1f2937}
  body{font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;background:var(--bg);color:var(--dark);}
  header{background:#0b1220;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .logo{font-weight:700;font-size:1.15rem}
  .searchbox{margin-left:12px;flex:1}
  .searchbox input{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff}
  .auth{display:flex;gap:8px}
  .auth button{background:transparent;border:1px solid rgba(255,255,255,0.12);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer}

  .wrap{display:flex;height:calc(100vh - 56px)}
  aside{width:260px;background:#101827;color:#dbe7ff;padding:18px;overflow:auto}
  aside h2{margin:0 0 12px;font-size:1rem}
  .new-btn{width:100%;padding:10px;border-radius:6px;background:var(--primary);color:#fff;border:none;cursor:pointer;margin-bottom:12px}
  .page-list a{display:block;padding:8px;border-radius:6px;color:inherit;text-decoration:none;margin-bottom:6px}
  .page-list a.active{background:rgba(255,255,255,0.06)}
  .trash-btn{display:block;margin-top:8px;padding:8px;border-radius:6px;background:#111827;color:#fca5a5;border:none;cursor:pointer;width:100%;text-align:left}
  main{flex:1;padding:24px;overflow:auto}
  .title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .page-title{font-size:1.6rem;margin:0;padding-bottom:6px;border-bottom:3px solid var(--primary);}
  .controls{display:flex;gap:8px}
  .btn{padding:8px 12px;border-radius:6px;border:none;background:var(--primary);color:#fff;cursor:pointer}
  .danger{background:#e11d48}
  .content{background:#fff;padding:18px;border-radius:8px;margin-top:12px;max-width:900px}
  .edit-area{margin-top:12px}
  textarea{width:100%;min-height:260px;padding:12px;border-radius:6px;border:1px solid #e2e8f0;font-family:monospace}

  .comments{margin-top:18px}
  .comment{border-top:1px solid #eef2f7;padding:10px 0}
  .comment .meta{font-size:0.85rem;color:#64748b}
  .upload{margin-top:8px}
  .meta-badge{font-size:0.8rem;color:#64748b;margin-left:8px}

  footer{padding:12px;text-align:center;color:#64748b}

  /* responsive */
  @media(max-width:900px){aside{display:none} .wrap{height:auto} header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <div class="logo">담비위키</div>
  <div class="searchbox"><input id="globalSearch" placeholder="문서 검색..." oninput="searchPages()"></div>
  <div class="auth" id="authArea">
    <button id="loginBtn">로그인</button>
    <button id="signupBtn">회원가입</button>
  </div>
</header>
<div class="wrap">
  <aside>
    <h2>📚 문서 목록</h2>
    <button class="new-btn" onclick="newPage()">+ 새 문서</button>
    <div class="page-list" id="pageList"></div>
    <button class="trash-btn" id="openTrashBtn" onclick="openTrash()">휴지통 (0)</button>
    <hr style="margin:12px 0;border:none;border-top:1px dashed rgba(255,255,255,0.04)">
    <div style="font-size:0.9rem;color:#9fb4e6">담비위키 — 나무마크 문법 지원 위키</div>
  </aside>

  <main>
    <div class="title-row">
      <h1 class="page-title" id="pageTitle">환영합니다</h1>
      <div class="controls">
        <button class="btn" id="editBtn" onclick="editPage()">편집</button>
        <button class="btn" id="saveBtn" onclick="savePage()" style="display:none">저장</button>
        <button class="btn" id="cancelBtn" onclick="cancelEdit()" style="display:none;background:#9aa5b8">취소</button>
        <button class="btn danger" id="deleteBtn" onclick="deletePage()">삭제</button>
      </div>
    </div>

    <div class="content" id="pageContent"></div>

    <div class="edit-area" id="editArea" style="display:none">
      <input id="editTitle" style="font-size:1.25rem;width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:8px">
      <textarea id="editContent"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <input type="file" id="fileInput">
        <button class="btn" onclick="uploadFile()">업로드</button>
        <div id="uploadStatus" style="font-size:0.9rem;color:#64748b"></div>
      </div>
    </div>

    <section class="comments" id="commentsSection">
      <h3>댓글</h3>
      <div id="commentsList"></div>
      <div style="margin-top:8px">
        <textarea id="commentInput" placeholder="댓글을 입력하세요..." style="width:100%;min-height:80px;padding:8px;border-radius:6px"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" onclick="postComment()">댓글 작성</button>
        </div>
      </div>
    </section>
  </main>
</div>
<footer>이 데모는 Supabase 연동(선택)과 로컬폴백을 지원합니다.</footer>

<!-- 라이브러리: Supabase (ESM), DOMPurify -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
// 설정: 실제 프로젝트 사용 시 여기에 프로젝트 URL과 ANON 키를 넣어주세요.
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co' // <- 바꿔주세요
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY' // <- 바꿔주세요
const USE_SUPABASE = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY')
let supabase = null
if (USE_SUPABASE) {
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
}
</script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

<script>
// --- 데이터 소스: Supabase (설정된 경우) 또는 localStorage 폴백 ---
let pages = {"환영합니다": "= 환영합니다 =\n\n담비위키에 오신 것을 환영합니다.\n\n== 사용법 ==\n* 왼쪽에서 문서를 선택하거나 새 문서를 만드세요.\n* 편집 후 저장하면 서버에 업로드됩니다."}
let pagesMeta = {} // title -> { owner, createdAt, updatedAt }
let trash = {} // title -> { content, meta, comments, deletedBy, deletedAt }
let currentPage = '환영합니다'
let user = null // 현재 로그인 사용자 (supabase user 객체 또는 로컬 미니유저)

// DOM 요소 캐시
const pageListEl = document.getElementById('pageList')
const pageTitleEl = document.getElementById('pageTitle')
const pageContentEl = document.getElementById('pageContent')
const editArea = document.getElementById('editArea')
const editTitle = document.getElementById('editTitle')
const editContent = document.getElementById('editContent')
const editBtn = document.getElementById('editBtn')
const saveBtn = document.getElementById('saveBtn')
const cancelBtn = document.getElementById('cancelBtn')
const deleteBtn = document.getElementById('deleteBtn')
const commentsList = document.getElementById('commentsList')
const commentInput = document.getElementById('commentInput')
const authArea = document.getElementById('authArea')
const loginBtn = document.getElementById('loginBtn')
const signupBtn = document.getElementById('signupBtn')
const openTrashBtn = document.getElementById('openTrashBtn')

// Admin email stored in localStorage 'dambi_wiki_admin' (first signup becomes admin)
let adminEmail = localStorage.getItem('dambi_wiki_admin') || null

// 나무마크 개선 렌더러 (간단 구현)
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function namumarkToHTML(text){
  text = text || ''
  // 코드 블록
  text = text.replace(/```([\s\S]*?)```/g, function(m,p){return '<pre><code>'+escapeHtml(p)+'</code></pre>'})
  // 제목 (=...=)
  text = text.replace(/^======\s*(.*?)\s*======$/gm,'<h1>$1</h1>')
  text = text.replace(/^=====\s*(.*?)\s*=====$/gm,'<h2>$1</h2>')
  text = text.replace(/^====\s*(.*?)\s*====$/gm,'<h3>$1</h3>')
  text = text.replace(/^===\s*(.*?)\s*===$/gm,'<h4>$1</h4>')
  text = text.replace(/^==\s*(.*?)\s*==$/gm,'<h5>$1</h5>')
  text = text.replace(/^=\s*(.*?)\s*=$/gm,'<h6>$1</h6>')
  // 수평선
  text = text.replace(/^----$/gm,'<hr>')
  // 굵게/기울임
  text = text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  text = text.replace(/''(.+?)''/g,'<em>$1</em>')
  // 인용
  text = text.replace(/^>\s?(.*)$/gm,'<blockquote>$1</blockquote>')
  // 내부링크
  text = text.replace(/\[\[(.+?)\]\]/g,function(_,p){return '<a href="#" onclick="loadPage(\''+p.replace(/'/g,"\\'")+"')">'+p+'</a>'})
  // 외부링크 [URL 텍스트]
  text = text.replace(/\[(https?:\/\/.+?)\s+(.+?)\]/g,'<a href="$1" target="_blank" rel="noopener">$2</a>')
  // 이미지 [파일:URL]
  text = text.replace(/\[파일:(.+?)\]/g,'<img src="$1" style="max-width:100%;border-radius:6px">')
  // 표 행
  text = text.replace(/^\|\|(.+?)\|\|$/gm,function(match){const cells=match.slice(2,-2).split('||').map(c=>'<td>'+c.trim()+'</td>').join('');return '<tr>'+cells+'</tr>'})
  // 리스트
  text = text.replace(/^\*\s+(.+)$/gm,'<li>$1</li>')
  // 줄바꿈 -> <br>
  text = text.replace(/\n/g,'<br>')
  // sanitize via DOMPurify
  return DOMPurify.sanitize(text, {ALLOWED_TAGS:['h1','h2','h3','h4','h5','h6','strong','em','a','img','br','ul','li','ol','pre','code','blockquote','hr','table','tr','td']})
}

// 저장 로직: pages, pagesMeta, trash, comments in localStorage keys
function saveAllToLocal(){
  localStorage.setItem('dambi_wiki_pages', JSON.stringify(pages))
  localStorage.setItem('dambi_wiki_meta', JSON.stringify(pagesMeta))
  localStorage.setItem('dambi_wiki_trash', JSON.stringify(trash))
}

function loadAllFromLocal(){
  try{ if(localStorage.getItem('dambi_wiki_pages')) pages = JSON.parse(localStorage.getItem('dambi_wiki_pages')) }catch(e){}
  try{ if(localStorage.getItem('dambi_wiki_meta')) pagesMeta = JSON.parse(localStorage.getItem('dambi_wiki_meta')) }catch(e){}
  try{ if(localStorage.getItem('dambi_wiki_trash')) trash = JSON.parse(localStorage.getItem('dambi_wiki_trash')) }catch(e){}
}

// 페이지 목록 렌더
function updateTrashButton(){
  const cnt = Object.keys(trash).length
  openTrashBtn.textContent = '휴지통 ('+cnt+')'
}
function renderPageList(){
  pageListEl.innerHTML=''
  Object.keys(pages).sort().forEach(title=>{
    const a=document.createElement('a');a.href='#';a.textContent=title;a.className=(title===currentPage)?'active':'';a.onclick=(e)=>{e.preventDefault();loadPage(title)};pageListEl.appendChild(a)
  })
  updateTrashButton()
}

// backlinks 찾기
function findBacklinks(title){
  const backlinks = []
  Object.keys(pages).forEach(t=>{
    if(t===title) return
    if((pages[t]||'').includes('[['+title+']]')) backlinks.push(t)
  })
  return backlinks
}

// 로드 페이지
function loadPage(title){
  if(!pages[title]) return alert('문서를 찾을 수 없습니다.')
  currentPage=title
  pageTitleEl.textContent=title
  pageContentEl.innerHTML=namumarkToHTML(pages[title])
  renderPageList()
  loadComments(title)
  // show owner info
  const meta = pagesMeta[title]
  let badge = ''
  if(meta && meta.owner) badge = '<span class="meta-badge">작성자: '+escapeHtml(meta.owner)+'</span>'
  pageTitleEl.innerHTML = escapeHtml(title) + badge
}

// 편집 모드 전환
function editPage(){
  const meta = pagesMeta[currentPage] || {}
  // 권한 확인: 수정은 소유자 또는 admin만 가능
  if(meta.owner){
    if(!user || (user.email !== meta.owner && user.email !== adminEmail)){
      return alert('수정 권한이 없습니다. 문서 소유자 또는 관리자만 수정할 수 있습니다.')
    }
  }
  editArea.style.display='block'
  editBtn.style.display='none'
  saveBtn.style.display='inline-block'
  cancelBtn.style.display='inline-block'
  editTitle.value=currentPage
  editContent.value=pages[currentPage]||''
}
function cancelEdit(){
  editArea.style.display='none'
  editBtn.style.display='inline-block'
  saveBtn.style.display='none'
  cancelBtn.style.display='none'
}

// 저장: 로컬로 메타 업데이트. Supabase 연동 시 서버로 교체 가능
async function savePage(){
  const newTitle=editTitle.value.trim();const content=editContent.value
  if(!newTitle) return alert('제목을 입력하세요')
  // 제목 변경 처리: 이동된 메타
  if(newTitle !== currentPage){
    // move meta
    if(pagesMeta[currentPage]) pagesMeta[newTitle] = pagesMeta[currentPage]
    delete pages[currentPage]
    delete pagesMeta[currentPage]
  }
  pages[newTitle]=content
  const now = Date.now()
  if(!pagesMeta[newTitle]) pagesMeta[newTitle] = { owner: (user&&user.email)||null, createdAt: now, updatedAt: now }
  else pagesMeta[newTitle].updatedAt = now
  currentPage = newTitle
  saveAllToLocal()
  cancelEdit();renderPageList();loadPage(newTitle)
}

// 새 페이지
function newPage(){
  const title=prompt('새 문서 제목을 입력하세요:')
  if(title && !pages[title]){pages[title]='= '+title+' =\n\n내용을 입력하세요.';const now=Date.now();pagesMeta[title]={owner:(user&&user.email)||null,createdAt:now,updatedAt:now};saveAllToLocal();renderPageList();loadPage(title)}
}

// 검색
function searchPages(){
  const term=document.getElementById('globalSearch').value.toLowerCase()
  document.querySelectorAll('.page-list a').forEach(a=>{a.style.display=a.textContent.toLowerCase().includes(term)?'block':'none'})
}

// 댓글: 로컬 저장 방식 (Supabase 통합은 추후 키 제공 시 연결)
function loadComments(page){
  commentsList.innerHTML=''
  const all = JSON.parse(localStorage.getItem('dambi_wiki_comments')||'{}')
  const comments = all[page]||[]
  comments.forEach(c=>{
    const div=document.createElement('div');div.className='comment';div.innerHTML='<div class="meta">'+escapeHtml(c.user||'익명')+' • '+new Date(c.created).toLocaleString()+'</div><div class="body">'+DOMPurify.sanitize(c.text)+'</div>'
    commentsList.appendChild(div)
  })
}
function postComment(){
  const text=commentInput.value.trim()
  if(!text) return alert('댓글 내용을 입력하세요')
  const all = JSON.parse(localStorage.getItem('dambi_wiki_comments')||'{}')
  all[currentPage]=all[currentPage]||[]
  all[currentPage].push({user:(user&&user.email)||'익명',text:text,created:Date.now()})
  localStorage.setItem('dambi_wiki_comments',JSON.stringify(all))
  commentInput.value=''
  loadComments(currentPage)
}

// 파일 업로드: 브라우저 -> Supabase 스토리지 (설정 없으면 로컬 URL 사용)
async function uploadFile(){
  const f = document.getElementById('fileInput').files[0]
  if(!f) return alert('파일을 선택하세요')
  document.getElementById('uploadStatus').textContent='업로드 중...'
  // If supabase configured, upload to storage
  if(typeof createClient !== 'undefined'){
    // supabase integration placeholder
  }
  // fallback: create object URL and insert image tag
  const url = URL.createObjectURL(f)
  const insert = '\n[파일:'+url+']\n'
  editContent.value = editContent.value + '\n' + insert
  document.getElementById('uploadStatus').textContent='업로드 완료 (임시 URL)'
}

// 문서 삭제: soft delete -> trash with backlinks check and permission check
function deletePage(){
  const title = currentPage
  const meta = pagesMeta[title] || {}
  // permission: only owner or admin
  if(meta.owner){
    if(!user || (user.email !== meta.owner && user.email !== adminEmail)){
      return alert('삭제 권한이 없습니다. 문서 소유자 또는 관리자만 삭제할 수 있습니다.')
    }
  } else {
    // no owner: require admin
    if(!user || user.email !== adminEmail){
      return alert('소유자가 설정되지 않은 문서는 관리자만 삭제할 수 있습니다.')
    }
  }

  // backlinks
  const backlinks = findBacklinks(title)
  if(backlinks.length>0){
    if(!confirm('다음 문서들이 "'+title+'"을(를) 링크하고 있습니다:\n- '+backlinks.join('\n- ')+'\n\n계속 삭제하시겠습니까?')) return
  } else {
    if(!confirm('"'+title+'" 문서를 휴지통으로 이동하시겠습니까?')) return
  }

  // move to trash
  const allComments = JSON.parse(localStorage.getItem('dambi_wiki_comments')||'{}')
  const commentsForPage = allComments[title]||[]
  trash[title] = { content: pages[title], meta: pagesMeta[title]||null, comments: commentsForPage, deletedBy: (user&&user.email)||'익명', deletedAt: Date.now() }
  // remove
  delete pages[title]
  delete pagesMeta[title]
  if(allComments[title]){ delete allComments[title]; localStorage.setItem('dambi_wiki_comments', JSON.stringify(allComments)) }
  saveAllToLocal()

  // select next page or create welcome
  const keys = Object.keys(pages)
  if(keys.length===0){
    pages['환영합니다'] = '= 환영합니다 =\n\n새 문서를 시작합니다.'
    pagesMeta['환영합니다'] = { owner: null, createdAt: Date.now(), updatedAt: Date.now() }
    saveAllToLocal();renderPageList();loadPage('환영합니다')
  } else {
    renderPageList();loadPage(keys[0])
  }
  alert('문서를 휴지통으로 이동했습니다.')
}

// 휴지통 보기
function openTrash(){
  // render trash list in main
  pageTitleEl.textContent = '휴지통'
  let html = '<div style="background:#fff;padding:12px;border-radius:8px">'
  const keys = Object.keys(trash)
  if(keys.length===0) html += '<p>휴지통이 비어 있습니다.</p>'
  else{
    html += '<ul>'
    keys.forEach(t=>{
      const item = trash[t]
      html += '<li style="margin-bottom:8px"><strong>'+escapeHtml(t)+'</strong> — 삭제자: '+escapeHtml(item.deletedBy)+' • '+new Date(item.deletedAt).toLocaleString()+" <button onclick=\"restorePage('"+encodeURIComponent(t)+"')\" style='margin-left:8px'>복원</button> <button onclick=\"permanentlyDeletePage('"+encodeURIComponent(t)+"')\" style='margin-left:6px;background:#e11d48;color:#fff'>완전삭제</button></li>"
    })
    html += '</ul>'
  }
  html += '</div>'
  pageContentEl.innerHTML = html
}

// 복원
function restorePage(encodedTitle){
  const title = decodeURIComponent(encodedTitle)
  if(!trash[title]) return alert('항목을 찾을 수 없습니다')
  // restore content
  pages[title] = trash[title].content
  if(trash[title].meta) pagesMeta[title] = trash[title].meta
  // restore comments
  const allComments = JSON.parse(localStorage.getItem('dambi_wiki_comments')||'{}')
  allComments[title] = trash[title].comments || []
  localStorage.setItem('dambi_wiki_comments', JSON.stringify(allComments))
  // remove from trash
  delete trash[title]
  saveAllToLocal();renderPageList();loadPage(title)
  alert('복원되었습니다.')
}

// 영구 삭제
function permanentlyDeletePage(encodedTitle){
  const title = decodeURIComponent(encodedTitle)
  if(!trash[title]) return alert('항목을 찾을 수 없습니다')
  if(!confirm('"'+title+'"을(를) 완전 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return
  // remove from trash
  delete trash[title]
  saveAllToLocal();openTrash();alert('완전 삭제되었습니다.')
}

// Auth: 간단한 로컬 모드 (Supabase 사용 권장)
loginBtn.addEventListener('click', ()=>{
  const email=prompt('이메일:')
  const pw=prompt('비밀번호:')
  if(!email||!pw) return
  user={email:email}
  localStorage.setItem('dambi_wiki_user', JSON.stringify(user))
  renderAuth()
})
signupBtn.addEventListener('click', ()=>{
  const email=prompt('회원가입 이메일:')
  const pw=prompt('비밀번호:')
  if(!email||!pw) return
  user={email:email}
  localStorage.setItem('dambi_wiki_user', JSON.stringify(user))
  // first signup becomes admin if none
  if(!localStorage.getItem('dambi_wiki_admin')){ localStorage.setItem('dambi_wiki_admin', email); adminEmail = email; alert('당신은 관리자 계정으로 설정되었습니다.') }
  alert('회원가입 완료 (데모)')
  renderAuth()
})
function renderAuth(){
  const stored = localStorage.getItem('dambi_wiki_user')
  adminEmail = localStorage.getItem('dambi_wiki_admin') || null
  if(stored){user=JSON.parse(stored);let badge = (user.email===adminEmail)?' <span style="color:#fde68a">(관리자)</span>':'';authArea.innerHTML='<div style="color:#fff">'+escapeHtml(user.email)+badge+'</div><button onclick="logout()" style="background:transparent;border:1px solid rgba(255,255,255,0.12);color:#fff;padding:6px 10px;border-radius:6px">로그아웃</button>'}else{authArea.innerHTML='<button id="loginBtn">로그인</button><button id="signupBtn">회원가입</button>';document.getElementById('loginBtn').addEventListener('click', ()=>loginBtn.click());document.getElementById('signupBtn').addEventListener('click', ()=>signupBtn.click())}
}
function logout(){localStorage.removeItem('dambi_wiki_user');user=null;renderAuth()}
