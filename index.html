<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>한월어 사전 — 한자(베트남식) 사전</title>

  <!-- Liberty-like layout stylesheet (custom, simplified) -->
  <link rel="stylesheet" href="https://fontmeme.com/ktype/gwm-sans-chinese-font/" />
  <style>
    :root{
      --bg:#f6f7f8;
      --panel:#ffffff;
      --accent:#2b7a78;
      --muted:#6b7280;
      --sidebar-width:260px;
      --max-width:1100px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    /* Basic reset */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:#111}

    /* Topbar */
    .topbar{background:linear-gradient(180deg,#ffffff,#f3f6f6);border-bottom:1px solid #e6eaeb}
    .topbar-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px}
    .logo{display:flex;align-items:center;gap:12px}
    .logo .mark{width:44px;height:44px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px}
    .sitename{font-weight:700;font-size:18px}
    .subtitle{font-size:13px;color:var(--muted)}

    /* Search */
    .top-search{margin-left:auto}
    .searchbox{display:flex;align-items:center;background:#fff;border:1px solid #d8e0df;padding:6px 8px;border-radius:6px;box-shadow:0 1px 0 rgba(16,24,32,0.02)}
    .searchbox input{border:0;outline:0;font-size:14px;width:300px}
    .searchbox button{background:var(--accent);border:0;color:#fff;padding:8px 12px;border-radius:4px;cursor:pointer}

    /* Layout */
    .container{max-width:var(--max-width);margin:24px auto;display:flex;gap:20px;padding:0 12px}
    .sidebar{width:var(--sidebar-width);background:var(--panel);border:1px solid #e6eaeb;border-radius:8px;padding:16px;height:calc(100vh - 160px);overflow:auto}
    .main{flex:1;min-height:600px}

    /* Sidebar content */
    .nav-section{margin-bottom:18px}
    .nav-section h3{font-size:13px;margin:0 0 8px;color:var(--muted)}
    .nav-section ul{list-style:none;padding:0;margin:0}
    .nav-section li{padding:6px 8px;border-radius:6px;color:#0f172a;cursor:pointer}
    .nav-section li:hover{background:#f1f5f4}

    /* Panel */
    .panel{background:var(--panel);border:1px solid #e6eaeb;border-radius:8px;padding:18px}

    /* Entry list */
    .entry-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .entry-card{padding:12px;border-radius:8px;border:1px solid #eef2f2;background:#fff;cursor:pointer}
    .entry-card h4{margin:0;font-size:18px}
    .entry-card p{margin:6px 0 0;color:var(--muted);font-size:13px}

    /* Entry view */
    .entry-header{display:flex;align-items:center;gap:18px}
    .hanzi{font-family: "GWM Sans Chinese", "Noto Serif CJK KR", serif; font-size:48px;color:#062e2d}
    .readings{display:flex;flex-direction:column}
    .reading-line{color:var(--muted);font-size:14px}
    .definition{margin-top:12px}

    /* Footer */
    .footer{max-width:var(--max-width);margin:20px auto;color:var(--muted);font-size:13px;text-align:center}

    /* Responsive */
    @media (max-width:900px){
      .container{flex-direction:column}
      .sidebar{width:100%;height:auto}
      .searchbox input{width:160px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <div class="mark">한</div>
        <div>
          <div class="sitename">한월어 사전</div>
          <div class="subtitle">한자(베트남식 한자어) — Han-Viet dictionary</div>
        </div>
      </div>

      <div class="top-search">
        <form id="searchForm" onsubmit="return false;" class="searchbox" role="search" aria-label="사전 검색">
          <input id="q" placeholder="한자/음/어휘를 검색하세요 (예: 學, học, 학교)" aria-label="검색어 입력" />
          <button id="searchBtn">검색</button>
        </form>
      </div>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar panel" aria-label="사이드바">
      <div class="nav-section">
        <h3>목차</h3>
        <ul>
          <li onclick="showHome()">홈</li>
          <li onclick="showAll()">전체 항목</li>
          <li onclick="filterCategory('명사')">명사</li>
          <li onclick="filterCategory('동사')">동사</li>
        </ul>
      </div>

      <div class="nav-section">
        <h3>자주찾는 한자</h3>
        <ul id="frequentList"></ul>
      </div>

      <div class="nav-section">
        <h3>정보</h3>
        <ul>
          <li onclick="showAbout()">이 사이트에 대하여</li>
        </ul>
      </div>
    </aside>

    <main class="main">
      <div id="content" class="panel">
        <!-- Content is rendered here by JS -->
      </div>
    </main>
  </div>

  <div class="footer">한월어 사전 — 미디어위키 Liberty 스킨 모방 레이아웃 / 사전 기능만 구현</div>

  <script>
    // Sample dictionary data (in a real site this would come from JSON or a backend)
    const DICT = [
      {
        id: "1",
        hanzi: "學",
        hangul: "학",
        hanviet: "học",
        pos: "명사",
        meaning: "배우다; 공부하다. 학교와 관련된 뜻으로도 사용됨.",
        examples: ["學校 (학교) — school", "學問 (학문) — learning"]
      },
      {
        id: "2",
        hanzi: "人",
        hangul: "인",
        hanviet: "nhân",
        pos: "명사",
        meaning: "사람. 인간을 가리키는 한자.",
        examples: ["人生 (인생) — life", "人口 (인구) — population"]
      },
      {
        id: "3",
        hanzi: "說",
        hangul: "설",
        hanviet: "thuyết/thoại",
        pos: "동사",
        meaning: "말하다; 설명하다.",
        examples: ["說明 (설명) — explanation", "說話 (설화) — to speak"]
      },
      {
        id: "4",
        hanzi: "和",
        hangul: "화",
        hanviet: "hòa",
        pos: "명사",
        meaning: "화합, 온화함; 일본·한국·베트남 공통 한자의 뜻을 가짐.",
        examples: ["和平 (화평) — peace", "和食 (화식) — Japanese food"]
      }
    ];

    // Initial render: home
    function renderHome(){
      const el = document.getElementById('content');
      el.innerHTML = `
        <h2>한월어 사전</h2>
        <p>이 사전은 한자 표제어에 대해 베트남식 한자음(Han-Viet), 한국어 음(한글), 품사와 뜻을 제공합니다. 미디어위키 Liberty 스킨의 레이아웃을 모방했지만 위키 기능은 없습니다.</p>
        <div style="margin-top:14px" class="panel">
          <h3>최근 항목</h3>
          <div class="entry-list" id="recent"></div>
        </div>
      `;
      const recent = document.getElementById('recent');
      DICT.slice(0,4).forEach(d=>{
        const card = document.createElement('div');card.className='entry-card';
        card.innerHTML = `<h4>${d.hanzi} <small style='color:var(--muted);font-size:13px'>${d.hanviet}</small></h4><p>${d.meaning}</p>`;
        card.onclick = ()=> showEntry(d.id);
        recent.appendChild(card);
      });

      populateFrequent();
    }

    function showAll(){
      const el = document.getElementById('content');
      el.innerHTML = '<h2>전체 항목</h2><div class="entry-list" id="allList"></div>';
      const all = document.getElementById('allList');
      DICT.forEach(d=>{
        const card = document.createElement('div');card.className='entry-card';
        card.innerHTML = `<h4>${d.hanzi} <small style='color:var(--muted);font-size:13px'>${d.hanviet}</small></h4><p>${d.meaning}</p>`;
        card.onclick = ()=> showEntry(d.id);
        all.appendChild(card);
      });
    }

    function showEntry(id){
      const d = DICT.find(x=>x.id===id);
      if(!d) return;
      const el = document.getElementById('content');
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
          <div style="flex:0 0 auto" class="entry-header">
            <div class="hanzi">${d.hanzi}</div>
            <div class="readings">
              <div style="font-weight:700;font-size:20px">${d.hangul} <span style="color:var(--muted);font-size:14px">(${d.hanviet})</span></div>
              <div class="reading-line">품사: ${d.pos}</div>
            </div>
          </div>
        </div>
        <div class="definition">
          <h3>뜻</h3>
          <p>${d.meaning}</p>
          <h3>예문 / 파생어</h3>
          <ul>
            ${d.examples.map(e=>`<li>${e}</li>`).join('')}
          </ul>
        </div>
      `;

      addToFrequent(d);
    }

    function showAbout(){
      const el = document.getElementById('content');
      el.innerHTML = `
        <h2>이 사이트에 대하여</h2>
        <p>이 사이트는 한월어(베트남식 한자음)를 중심으로 한자 표제어의 음과 뜻을 보여주는 간단한 사전입니다. 미디어위키의 Liberty 스킨 레이아웃을 모방했지만, 위키 편집/토론/버전 관리 기능은 포함하지 않습니다.</p>
      `;
    }

    // Search implementation (matches hanzi, hanviet, hangul, meaning)
    function search(q){
      q = (q||'').trim();
      const el = document.getElementById('content');
      if(!q){ renderHome(); return }
      const lower = q.toLowerCase();
      const results = DICT.filter(d=>{
        return d.hanzi.includes(q) || (d.hanviet && d.hanviet.toLowerCase().includes(lower)) || (d.hangul && d.hangul.includes(q)) || (d.meaning && d.meaning.toLowerCase().includes(lower));
      });
      el.innerHTML = `<h2>검색 결과: "${q}" — ${results.length}건</h2><div class="entry-list" id="searchList"></div>`;
      const list = document.getElementById('searchList');
      results.forEach(d=>{
        const card = document.createElement('div');card.className='entry-card';
        card.innerHTML = `<h4>${d.hanzi} <small style='color:var(--muted);font-size:13px'>${d.hanviet}</small></h4><p>${d.meaning}</p>`;
        card.onclick = ()=> showEntry(d.id);
        list.appendChild(card);
      });
    }

    // Sidebar frequent list (storage in localStorage)
    function populateFrequent(){
      const ul = document.getElementById('frequentList');ul.innerHTML='';
      const freq = JSON.parse(localStorage.getItem('hv_freq')||'[]');
      freq.forEach(id=>{
        const d = DICT.find(x=>x.id===id); if(!d) return;
        const li = document.createElement('li'); li.textContent = `${d.hanzi} — ${d.hanviet}`; li.onclick = ()=> showEntry(d.id);
        ul.appendChild(li);
      });
    }
    function addToFrequent(d){
      const key='hv_freq';
      let arr = JSON.parse(localStorage.getItem(key)||'[]');
      arr = arr.filter(x=>x!==d.id);
      arr.unshift(d.id);
      if(arr.length>10) arr=arr.slice(0,10);
      localStorage.setItem(key,JSON.stringify(arr));
      populateFrequent();
    }

    function filterCategory(cat){
      const results = DICT.filter(d=>d.pos===cat);
      const el = document.getElementById('content');
      el.innerHTML = `<h2>"${cat}" 카테고리 — ${results.length}건</h2><div class="entry-list" id="catList"></div>`;
      const list = document.getElementById('catList');
      results.forEach(d=>{
        const card = document.createElement('div');card.className='entry-card';
        card.innerHTML = `<h4>${d.hanzi} <small style='color:var(--muted);font-size:13px'>${d.hanviet}</small></h4><p>${d.meaning}</p>`;
        card.onclick = ()=> showEntry(d.id);
        list.appendChild(card);
      });
    }

    function showHome(){ renderHome(); }

    document.getElementById('searchBtn').addEventListener('click', ()=>{
      const q = document.getElementById('q').value; search(q);
    });
    document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ search(e.target.value); } });

    // Init
    renderHome();
  </script>
</body>
</html>
